# golangci-lint configuration file
# Documentation: https://golangci-lint.run/usage/configuration/
# This configuration enables all linters by default and selectively disables those
# that are too strict, opinionated, or generate false positives for this codebase.

version: "2"

# ============================================================================
# Run Configuration
# ============================================================================
# Controls how golangci-lint executes and interacts with the Go module system.
run:
  # Module download mode for dependencies
  # Options: readonly (don't modify go.mod/go.sum), vendor, mod, sum
  # readonly: fails if updates are needed, ensuring reproducible builds
  modules-download-mode: readonly
  
  # Whether to run linters on test files (*_test.go)
  # Set to false to skip test files for faster linting
  tests: false
  
  # Allow multiple golangci-lint instances to run in parallel
  # Useful for CI environments with multiple concurrent jobs
  allow-parallel-runners: true

# ============================================================================
# Linters Configuration
# ============================================================================
# Defines which linters are enabled and their specific settings.
linters:
  # Enable all available linters by default
  # This ensures maximum coverage and we don't miss new linters added in updates
  default: all

  # Enable custom linters
  enable:
    - attgo

  # Selectively disable linters that don't fit this project's needs
  # Each disabled linter has a comment explaining the rationale
  disable:
    - contextcheck      # Too strict about context.Context usage patterns
    - cyclop            # Cyclomatic complexity - prefer other complexity checks
    - depguard          # Dependency restrictions not needed for this project
    - dupl              # Duplicate code detection - too many false positives
    - err113            # Error wrapping style - conflicts with project conventions
    - exhaustive        # Exhaustive enum switch checks - too strict for this codebase
    - exhaustruct       # Require all struct fields - impractical for large structs
    - forcetypeassert   # Force type assertion checks - handled by other linters
    - funlen            # Function length limits - too restrictive for complex functions
    - gochecknoglobals  # Global variable checks - necessary for some patterns
    - gocognit          # Cognitive complexity - covered by other complexity checks
    - goconst           # Constant extraction - not always beneficial for readability
    - inamedparam       # Named parameter checks - too opinionated for this project
    - ireturn           # Interface return checks - conflicts with abstraction patterns
    - lll               # Line length - configured separately with revive
    - mnd               # Magic number detection - too aggressive and noisy
    - musttag           # Struct tag validation - too strict for this project
    - nestif            # Nested if depth - too restrictive for complex logic
    - nilnil            # Return nil, nil checks - valid pattern in some cases
    - nlreturn          # Newline before return - too opinionated on formatting
    - perfsprint        # Performance checks for fmt.Sprint - micro-optimization
    - promlinter        # Prometheus metrics linting - not applicable to this project
    - recvcheck         # Receiver name consistency - handled by revive
    - varnamelen        # Variable name length - too opinionated
    - wrapcheck         # Error wrapping checks - conflicts with project style
    - wsl               # Whitespace linting - too opinionated on code formatting
    - noinlineerr       # Inline error checks - valid pattern in some cases
  
  # ============================================================================
  # Linter-Specific Settings
  # ============================================================================
  # Configuration for individual linters with detailed explanations.
  settings:
    # --------------------------------------------------------------------------
    # goheader: Enforces consistent copyright/license headers in all Go files
    # Documentation: https://github.com/denis-tingaikin/go-header
    # --------------------------------------------------------------------------
    goheader:
      values:
        regexp:
          # Pattern to match copyright years (supports ranges and single years)
          # Matches formats: "2024", "2024, 2025", "2024 - 2025"
          YEARS: (20\d\d - 20\d\d|20\d\d, 20\d\d|20\d\d)
      # Template for required file headers
      # All Go files must start with this Apache 2.0 license header
      template: |-
        Copyright © {{ YEARS }} Attestant Limited.
        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

            http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.
    
    # --------------------------------------------------------------------------
    # gosec: Security vulnerability detection and best practices
    # Documentation: https://github.com/securego/gosec
    # --------------------------------------------------------------------------
    gosec:
      excludes:
        # G115: Integer overflow conversion checks
        # Disabled: Produces false positives in cryptographic operations
        # where integer conversions are carefully controlled and validated
        - G115
    
    # --------------------------------------------------------------------------
    # revive: Fast, configurable, extensible Go linter framework
    # Replaces deprecated golint with more features and better performance
    # Documentation: https://github.com/mgechev/revive
    # --------------------------------------------------------------------------
    revive:
      # Minimum confidence level for rule violations (range: 0.0-1.0)
      # Higher values = fewer but more certain violations reported
      confidence: 0.8
      
      # Severity level for violations
      # Options: error (fail build), warning (report only)
      severity: error
      
      # Enable all available rules by default
      # Individual rules can be disabled or configured in the rules section below
      enable-all-rules: true
      
      # Rule-specific configurations with rationale for each decision
      rules:
        - name: add-constant
          disabled: true
          # Disabled: Suggests extracting magic numbers to constants
          # Reason: Often too aggressive and may reduce code readability
        
        - name: cyclomatic
          disabled: true
          # Disabled: Cyclomatic complexity measurement
          # Reason: Covered by other linters and can be too strict
        
        - name: cognitive-complexity
          disabled: true
          # Disabled: Cognitive complexity measurement (different from cyclomatic)
          # Reason: Too strict for complex but necessary business logic
        
        - name: confusing-results
          # Enabled: Detects confusing function return patterns
          # Example: (bool, error) vs (value, error) inconsistencies
        
        - name: flag-parameter
          disabled: true
          # Disabled: Detects boolean parameters used as control flags
          # Reason: Boolean parameters are acceptable for simple success/failure states
          # and don't necessarily indicate control coupling issues
        
        - name: function-length
          disabled: true
          # Disabled: Function length restrictions (lines of code)
          # Reason: Too restrictive; some functions naturally need more lines
        
        - name: line-length-limit
          arguments:
            - 132
          # Maximum line length in characters
          # Set to 132 to allow reasonable line lengths without horizontal scrolling
          # Standard terminal width is 80, but modern displays support more
        
        - name: max-public-structs
          disabled: true
          # Disabled: Limits number of public structs per file
          # Reason: Too strict for API packages that export many types
        
        - name: package-comments
          disabled: true
          # Disabled: Requires package documentation comments
          # Reason: Not always necessary for internal/small packages
        
        - name: package-directory-mismatch
          disabled: true
          # Disabled: Requires package name to match directory name
          # Reason: Package name should be based on its purpose, not the repository name
          # A directory named "go-relay-client" can export package "client"
        
        - name: struct-tag
          arguments:
            - json,allowempty
          # Validates struct tags for common mistakes
          # Ensures JSON tags are properly formatted and consistent
        
        - name: unsecure-url-scheme
          disabled: true
          # Disabled: Flags use of http:// instead of https://
          # Reason: HTTP URLs are sometimes necessary for local development,
          # testing, or when the protocol is determined at runtime
        
        - name: unhandled-error
          arguments:
            - fmt.Fprint
            - fmt.Fprintf
          # Functions whose error returns must be explicitly checked
          # These functions can fail (e.g., write errors) and need error handling

        - name: var-naming
          arguments:
            - [] # AllowList: no extra initialisms to allow
            - [] # DenyList: no names to forbid
            - - skipPackageNameChecks: true
          # Configures variable/package naming checks
          # skipPackageNameChecks: true — the http package name conflicts with the
          # stdlib net/http but is part of this module's published API, so renaming
          # is not feasible without a major version bump
    
    # --------------------------------------------------------------------------
    # lll: Line length linter
    # Simple line length checker (fallback if revive line-length-limit disabled)
    # --------------------------------------------------------------------------
    lll:
      # Maximum line length in characters
      line-length: 132
    
    # --------------------------------------------------------------------------
    # nlreturn: Newline before return statement checks
    # Enforces blank lines before return statements for readability
    # --------------------------------------------------------------------------
    nlreturn:
      # Minimum block size (lines) before requiring newline before return
      # Only enforces newlines in blocks with 3+ lines of code
      block-size: 3
    
    # --------------------------------------------------------------------------
    # staticcheck: Advanced static analysis for Go code
    # One of the most important linters, part of the staticcheck suite
    # Documentation: https://staticcheck.io/docs/
    # --------------------------------------------------------------------------
    staticcheck:
      checks:
        - all      # Enable all staticcheck rules (SA*, ST*, S*)
        - -ST1000  # Disable: Package comment format check
                   # Reason: Too strict about package comment formatting
    
    # --------------------------------------------------------------------------
    # tagliatelle: Struct tag naming convention enforcer
    # Ensures consistent naming across different serialization formats
    # Documentation: https://github.com/ldez/tagliatelle
    # --------------------------------------------------------------------------
    tagliatelle:
      case:
        rules:
          json: snake  # JSON tags must use snake_case (e.g., first_name)
          yaml: snake  # YAML tags must use snake_case (e.g., first_name)

    # attgo-linter: Attestant organization coding standards
    custom:
      attgo:
        type: "module"
        description: "Attestant organization style linter"
        settings:
          # HIGH PRIORITY
          enable_no_pkg_logger: true
          enable_enum_iota: true
          enable_current_year: true
          # MEDIUM PRIORITY
          enable_capital_comment: true
          enable_func_opts: true
          enable_raw_string: true
          # LOW PRIORITY
          enable_struct_field_order: true
          enable_interface_check: true
